# Build and publish the deployable image on every push to master.
# The Dockerfile is multi-stage (pnpm SPA build → CGO-free Go build → slim
# runtime); this workflow verifies the image builds and, on master, pushes it
# to GHCR. Local image build is verified on pull requests too, so a Dockerfile
# regression fails CI instead of the release.

name: docker-image

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nowhere-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR (master only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (master only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
